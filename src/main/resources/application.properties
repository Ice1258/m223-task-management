# ---------- Datenbank (H2, lokal als Datei unter ./data) ----------
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/taskdb
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.schema-management.strategy=update
# Keine automatischen Test-Datenbanken via Docker (im Devcontainer gibt es kein Docker)
quarkus.devservices.enabled=false

# Tests: frische In-Memory-Datenbank bei jedem Lauf
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ---------- Testdaten beim Start (Aufgabe 3.5) ----------
taskmanagement.demo-data.enabled=false
%dev.taskmanagement.demo-data.enabled=true
%test.taskmanagement.demo-data.enabled=true

# ---------- JWT (Aufgabe 5.3) ----------
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://task-management.example.com
smallrye.jwt.sign.key.location=privateKey.pem

# ---------- HTTP ----------
# Im Devcontainer auf allen Adressen hoeren, damit die Port-Weiterleitung funktioniert
%dev.quarkus.http.host=0.0.0.0

# ---------- OpenAPI / Swagger ----------
quarkus.smallrye-openapi.info-title=Task Management API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST-API der Aufgabenverwaltung (Modul 223)
quarkus.swagger-ui.always-include=true
